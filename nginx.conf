events {}

http {
    # DNS interno de Docker. Al usar el nombre de servicio dentro de una
    # variable, Nginx lo re-resuelve en cada peticion; cuando 'ia' tiene 2
    # replicas, el DNS las entrega por turnos y asi el gateway reparte entre ellas.
    resolver 127.0.0.11 valid=1s ipv6=off;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    proxy_connect_timeout 3s;
    # 30 s y no 5: en EP3 el dominio espera hasta 12 s al micro de IA, que a su
    # vez espera hasta 10 s al endpoint de SageMaker por si hay arranque en
    # frio. El gateway tiene que esperar mas que la capa de adentro, o corta la
    # peticion antes de que el fail-soft alcance a ejecutarse.
    proxy_read_timeout    30s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    server {
        listen 8080;

        # Salud del propio gateway (la usa el healthcheck del compose)
        location = /healthz {
            return 200 "ok";
            add_header Content-Type text/plain;
        }

        # --- Micro de IA (2 replicas) ---
        # Bajo /api/ia/ para que Caddy pueda bloquearlo desde internet: el
        # clasificador no se invoca desde el navegador. Lo llama el dominio.
        location = /api/ia/predict {
            set $destino "http://ia:8000/predict";
            proxy_pass $destino;
        }

        location = /api/ia/health {
            set $destino "http://ia:8000/health";
            proxy_pass $destino;
        }

        # --- API publica: todo pasa por el dominio, que exige X-API-Key ---
        location = /api/predict {
            set $destino "http://dominio:8000/api/predict";
            proxy_pass $destino;
        }

        location = /api/chat {
            set $destino "http://dominio:8000/api/chat";
            proxy_pass $destino;
        }

        location = /api/health {
            set $destino "http://dominio:8000/health";
            proxy_pass $destino;
        }

        # El front consulta aqui el texto que redacto el LLM. Sin URI en la
        # variable, Nginx reenvia la ruta completa tal como llego.
        location ^~ /api/respuesta/ {
            set $destino "http://dominio:8000";
            proxy_pass $destino;
        }

        # Contrato OpenAPI, publicado por el dominio
        location = /docs {
            set $destino "http://dominio:8000/docs";
            proxy_pass $destino;
        }

        location = /openapi.json {
            set $destino "http://dominio:8000/openapi.json";
            proxy_pass $destino;
        }

        # Front: pagina del asistente (todo lo demas)
        location / {
            set $destino "http://front:80";
            proxy_pass $destino;
        }
    }
}
