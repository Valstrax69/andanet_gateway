events {}

http {
    # DNS interno de Docker. Al usar el nombre de servicio dentro de una
    # variable, Nginx lo re-resuelve en cada peticion; cuando 'ia' tiene 2
    # replicas, el DNS las entrega por turnos y asi el gateway reparte entre ellas.
    resolver 127.0.0.11 valid=1s ipv6=off;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    proxy_connect_timeout 3s;
    proxy_read_timeout    5s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    server {
        listen 8080;

        # Salud del propio gateway (la usa el healthcheck del compose)
        location = /healthz {
            return 200 "ok";
            add_header Content-Type text/plain;
        }

        # Micro de dominio
        location = /api/chat {
            set $destino "http://dominio:8000/api/chat";
            proxy_pass $destino;
        }

        # Micro de IA (2 replicas). La URI /predict va dentro de la variable,
        # asi Nginx la envia tal cual al servicio balanceado.
        location = /api/predict {
            set $destino "http://ia:8000/predict";
            proxy_pass $destino;
        }

        # Front: pagina del asistente (todo lo demas)
        location / {
            set $destino "http://front:80";
            proxy_pass $destino;
        }
    }
}
